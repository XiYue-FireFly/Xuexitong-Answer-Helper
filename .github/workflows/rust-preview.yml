name: Build independent Rust Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-installer
      - name: Install locked JavaScript dependencies
        run: npm.cmd ci
      - name: Build standard and offline preview installers with provenance
        shell: pwsh
        run: ./scripts/build-rust-installer.ps1 -RuntimeMode Both
      - name: Upload independent preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisp-rs-windows-x64-preview
          path: release/rust/windows-preview/*/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisp-rs-preview-build-diagnostics
          path: .playwright-mcp/rust-installer/
          if-no-files-found: ignore
